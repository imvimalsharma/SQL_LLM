<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Text-to-SQL LLM (8.4M LLaMA)</title>
    <!-- Modern typography from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- ONNX Runtime Web library -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0c0e12;
            --container-bg: rgba(20, 24, 33, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --success-color: #10b981;
            --font-outfit: 'Outfit', sans-serif;
            --font-mono: 'Source Code Pro', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-outfit);
            background: radial-gradient(circle at top, #1e293b 0%, var(--bg-color) 70%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            max-width: 800px;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #1d4ed8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -0.05em;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 400;
        }

        main {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        .card {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(59, 130, 246, 0.2);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea, input[type="text"] {
            width: 100%;
            background: rgba(10, 12, 16, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            color: var(--text-primary);
            font-family: var(--font-outfit);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
            background: rgba(10, 12, 16, 1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        button {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: var(--font-outfit);
            font-weight: 600;
            font-size: 1.1rem;
            padding: 14px 28px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background: #1e293b;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }

        #status {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .status-info {
            color: var(--text-secondary);
        }

        .status-error {
            color: #ef4444;
        }

        .output-card {
            display: flex;
            flex-direction: column;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .output-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .output-container {
            background: #06080a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            min-height: 100px;
            display: flex;
            align-items: center;
            overflow-x: auto;
        }

        pre {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            color: #60a5fa;
            white-space: pre-wrap;
            word-break: break-all;
            width: 100%;
        }

        /* Progress Bar styles */
        #progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 15px;
            display: none;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            transition: width 0.4s ease;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Local Text-to-SQL LLM</h1>
        <p>An 8.4M parameter LLaMA-style model running entirely in your browser using ONNX Runtime Web</p>
    </header>

    <main>
        <div class="card">
            <div class="form-group">
                <label for="schema">Database Schema</label>
                <textarea id="schema" placeholder="e.g. CREATE TABLE users (id INT, name VARCHAR, age INT, country VARCHAR)">CREATE TABLE users (id INT, name VARCHAR, age INT, country VARCHAR)</textarea>
            </div>
            
            <div class="form-group">
                <label for="question">English Question</label>
                <input type="text" id="question" value="Find the name of users whose age is greater than 25." placeholder="e.g. Find the name of users whose age is greater than 25.">
            </div>

            <div class="btn-container">
                <button id="generate-btn" disabled>Generate SQL</button>
                <div id="status" class="status-info">Loading tokenizer...</div>
            </div>

            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>

        <div class="card output-card">
            <div class="output-header">
                <h2>Generated SQL</h2>
            </div>
            <div class="output-container">
                <pre id="output-sql">Waiting for generation...</pre>
            </div>
        </div>
    </main>

    <footer>
        <p>Built completely from scratch. 100% Client-side Inference.</p>
    </footer>

    <!-- Tokenizer and main execution scripts -->
    <script src="tokenizer.js"></script>
    <script src="main.js"></script>
</body>
</html>
